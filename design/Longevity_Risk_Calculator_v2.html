<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Longevity Risk Calculator</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --surface-3: #f4f6f8;
    --ink-1: #0f1720;
    --ink-2: #3a4654;
    --ink-3: #6b7a8a;
    --ink-4: #9aa6b2;
    --line-1: #e7ebef;
    --line-2: #eef1f4;
    --accent: oklch(0.55 0.09 240);
    --accent-soft: oklch(0.96 0.02 240);
    --accent-ink: oklch(0.42 0.10 240);
    --ok: oklch(0.62 0.13 155);
    --ok-soft: oklch(0.96 0.04 155);
    --warn: oklch(0.72 0.14 75);
    --warn-soft: oklch(0.97 0.05 75);
    --pop: #c9d1d9;
    --shadow-sm: 0 1px 0 rgba(15,23,32,0.02), 0 1px 2px rgba(15,23,32,0.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink-1);}
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .mono{font-family:'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "tnum" 1, "zero" 1;}
  #root{min-height:100vh}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="oklch(0.96 0.02 240)"/>
    <g transform="translate(20 30)" stroke="oklch(0.42 0.10 240)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 35 L10 30 L18 32 L26 18 L36 22 L46 8 L58 12"/>
      <circle cx="46" cy="8" r="3" fill="oklch(0.55 0.09 240)" stroke="none"/>
    </g>
    <rect x="20" y="70" width="60" height="3" rx="1.5" fill="oklch(0.55 0.09 240)" opacity="0.4"/>
  </svg>
</template>
<div id="root"></div>
<script type="text/babel" src="app-v2.jsx"></script>
</body>
</html>
